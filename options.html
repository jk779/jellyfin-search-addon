<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jellyfin Search settings</title><link rel="stylesheet" href="style.css"></head>
<body><header><div><span class="eyebrow">JELLYFIN SEARCH</span><h1>Settings</h1></div></header><main><form id="settings-form"><label for="url">Jellyfin address</label><input id="url" type="url" required placeholder="http://192.168.0.100:8096"><p class="muted">Enter your server address or paste a Jellyfin search URL. Subfolder installations are supported.</p><button class="primary" type="submit">Save settings</button><p id="status" role="status"></p></form><footer>Your address stays in this browser. Searches open Jellyfin using your existing login.</footer></main><script type="module" src="options.js"></script></body></html>
